name: Windows wheels (WIP)

on:
  push:
    branches: [windows-wheels]
  workflow_dispatch:
    inputs:
      build:
        description: "cibuildwheel build selector (e.g. cp312-* or cp31*-*)"
        required: false
        default: ""

jobs:
  windows:
    name: Windows wheels (${{ inputs.build || matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314, cp315]

    steps:
      - uses: actions/checkout@v4

      - name: Derive ISLPY versions from pyproject
        shell: bash
        run: |
          full_ver=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml | head -n1)
          base_ver="${full_ver%.post*}"
          echo "ISLPY_VERSION=$full_ver" >> $GITHUB_ENV
          echo "ISLPY_BASE_VERSION=$base_ver" >> $GITHUB_ENV

      - name: Restore native prefix cache (NTL/Barvinok/isl/polylib)
        id: prefix-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: prefix-windows-ucrt64-ntl-10.5.0-barvinok-0.41.8-${{ hashFiles('config.sh', 'scripts/build_windows_native.sh', 'patches/windows/**') }}

      - name: Set up MSYS2 (UCRT64)
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            make
            patch
            perl
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-gmp

      - name: Build native libs with MSYS2 UCRT64
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          BUILD_ROOT: ${{ github.workspace }}/build
        run: bash scripts/build_windows_native.sh

      - name: Save native prefix cache
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: ${{ steps.prefix-cache.outputs.cache-primary-key }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel==4.3.3"

      - name: Build wheels with cibuildwheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: ${{ inputs.build || format('{0}-*', matrix.python) }}
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: ISLPY_VERSION=${{ env.ISLPY_VERSION }} ISLPY_BASE_VERSION=${{ env.ISLPY_BASE_VERSION }}
          BUILD_ROOT: ${{ github.workspace }}\build
          # One-off extra verification: upstream islpy's own test suite
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "import islpy as isl, sys; print(sys.version, isl.Set('[N] -> {[x, y] : 0 <= x <= N and 0 <= y <= N}').card())"
            && python -m pytest -q -p no:cacheprovider ${{ github.workspace }}\build\src\islpy-${{ env.ISLPY_BASE_VERSION }}\test
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-wip-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
