name: CI wheels and publish

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux aarch64 builds natively on ubuntu-24.04-arm (no QEMU)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14]
        arch: [x86_64, aarch64, arm64]
        python: [cp310, cp311, cp312, cp313, cp314, cp315]
        exclude:
          - { os: ubuntu-latest, arch: aarch64 }
          - { os: ubuntu-latest, arch: arm64 }
          - { os: ubuntu-24.04-arm, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-15-intel, arch: aarch64 }
          - { os: macos-15-intel, arch: arm64 }
          - { os: macos-14, arch: aarch64 }
          - { os: macos-14, arch: x86_64 }

    steps:
      - uses: actions/checkout@v4

      - name: Derive ISLPY versions from tag or pyproject
        id: ver
        run: |
          ref="${GITHUB_REF:-${{ github.ref }}}"
          tag="${ref##*/}"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.post[0-9]+)?(-[0-9]+)?$ ]]; then
            base_ver="${BASH_REMATCH[1]}"
            post_suffix="${BASH_REMATCH[2]}"
            build_suffix="${BASH_REMATCH[3]}"
            full_ver="$base_ver${post_suffix}${build_suffix}"
          else
            # Fallback to pyproject version, stripping .postN suffix for base
            full_ver=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml | head -n1)
            base_ver="${full_ver%.post*}"
          fi
          echo "ISLPY_VERSION=$full_ver" >> $GITHUB_ENV
          echo "ISLPY_BASE_VERSION=$base_ver" >> $GITHUB_ENV

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Restore compiled prefix cache (GMP/NTL/Barvinok)
        id: restore-prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build/prefix
          # Keyed on the build script so changes to native build flags never
          # reuse a stale prefix (no restore-keys fallback on purpose)
          key: prefix-v2-${{ matrix.os }}-${{ matrix.arch }}-gmp-6.3.0-ntl-10.5.0-barvinok-0.41.8-${{ hashFiles('config.sh', 'scripts/build_all.sh') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel==4.3.3"

      - name: Build wheels with cibuildwheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: ${{ matrix.python }}-*
          # We repair inside scripts/build_all.sh for both OSes; pass-through here
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "bash -lc 'cp {wheel} {dest_dir}'"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "bash -lc 'cp {wheel} {dest_dir}'"
          BUILD_ROOT: ${{ github.workspace }}/build
          CIBW_ENVIRONMENT: ISLPY_VERSION=${{ env.ISLPY_VERSION }} ISLPY_BASE_VERSION=${{ env.ISLPY_BASE_VERSION }}
          CIBW_ENVIRONMENT_LINUX: BUILD_ROOT=/host${{ github.workspace }}/build/ ISLPY_VERSION=${{ env.ISLPY_VERSION }} ISLPY_BASE_VERSION=${{ env.ISLPY_BASE_VERSION }}
          ISLPY_VERSION: ${{ env.ISLPY_VERSION }}
          ISLPY_BASE_VERSION: ${{ env.ISLPY_BASE_VERSION }}
          # Install autotools in manylinux containers before building
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y autoconf automake libtool pkgconfig git curl || \
            (dnf install -y autoconf automake libtool pkgconfig git curl || true)
          # Arch selection per platform
          CIBW_ARCHS_LINUX: ${{ startsWith(matrix.os, 'ubuntu-') && matrix.arch || '' }}
          CIBW_ARCHS_MACOS: ${{ startsWith(matrix.os, 'macos-') && matrix.arch || '' }}
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Save compiled prefix cache (GMP/NTL/Barvinok)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build/prefix
          key: prefix-v2-${{ matrix.os }}-${{ matrix.arch }}-gmp-6.3.0-ntl-10.5.0-barvinok-0.41.8-${{ hashFiles('config.sh', 'scripts/build_all.sh') }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # Windows: NTL/Barvinok/isl/polylib are built once with MSYS2 UCRT64 into a
  # single barvinok_bundle.dll (scripts/build_windows_native.sh); the wheel jobs
  # below then only build the islpy extension itself with MSVC.
  build_native_windows:
    name: Build native libs (windows-latest / AMD64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore native prefix cache (NTL/Barvinok/isl/polylib)
        id: prefix-cache
        uses: actions/cache/restore@v4
        with:
          path: build/prefix
          key: prefix-windows-ucrt64-ntl-10.5.0-barvinok-0.41.8-${{ hashFiles('config.sh', 'scripts/build_windows_native.sh', 'patches/windows/**') }}

      - name: Set up MSYS2 (UCRT64)
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            make
            patch
            perl
            curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-gmp

      - name: Build native libs with MSYS2 UCRT64
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          BUILD_ROOT: ${{ github.workspace }}/build
        run: bash scripts/build_windows_native.sh

      - name: Save native prefix cache
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/prefix
          key: ${{ steps.prefix-cache.outputs.cache-primary-key }}

      - name: Upload native prefix
        uses: actions/upload-artifact@v4
        with:
          name: native-prefix-windows-AMD64
          path: build/prefix
          if-no-files-found: error
          retention-days: 3

  build_wheels_windows:
    name: Build wheels (windows-latest / AMD64 / ${{ matrix.python }})
    needs: [build_native_windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314, cp315]

    steps:
      - uses: actions/checkout@v4

      - name: Derive ISLPY versions from tag or pyproject
        shell: bash
        run: |
          ref="${GITHUB_REF:-${{ github.ref }}}"
          tag="${ref##*/}"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.post[0-9]+)?(-[0-9]+)?$ ]]; then
            base_ver="${BASH_REMATCH[1]}"
            post_suffix="${BASH_REMATCH[2]}"
            build_suffix="${BASH_REMATCH[3]}"
            full_ver="$base_ver${post_suffix}${build_suffix}"
          else
            # Fallback to pyproject version, stripping .postN suffix for base
            full_ver=$(sed -n 's/^version\s*=\s*"\([^"]*\)"/\1/p' pyproject.toml | head -n1)
            base_ver="${full_ver%.post*}"
          fi
          echo "ISLPY_VERSION=$full_ver" >> $GITHUB_ENV
          echo "ISLPY_BASE_VERSION=$base_ver" >> $GITHUB_ENV

      - name: Download native prefix
        uses: actions/download-artifact@v4
        with:
          name: native-prefix-windows-AMD64
          path: build/prefix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel==4.3.3"

      - name: Build wheels with cibuildwheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ENVIRONMENT: ISLPY_VERSION=${{ env.ISLPY_VERSION }} ISLPY_BASE_VERSION=${{ env.ISLPY_BASE_VERSION }}
          # build/prefix is also where [tool.cibuildwheel.windows] repair-wheel-command
          # (delvewheel) looks for barvinok_bundle.dll
          BUILD_ROOT: ${{ github.workspace }}\build
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-AMD64-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish to PyPI
    needs: [build_wheels, build_wheels_windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Derive ISLPY versions from tag
        run: |
          ref="${GITHUB_REF:-${{ github.ref }}}"
          tag="${ref##*/}"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.post[0-9]+)?(-[0-9]+)?$ ]]; then
            base_ver="${BASH_REMATCH[1]}"
            post_suffix="${BASH_REMATCH[2]}"
            build_suffix="${BASH_REMATCH[3]}"
            full_ver="$base_ver${post_suffix}${build_suffix}"
          else
            echo "Unexpected tag format: $tag" >&2
            exit 1
          fi
          echo "ISLPY_VERSION=$full_ver" >> $GITHUB_ENV
          echo "ISLPY_BASE_VERSION=$base_ver" >> $GITHUB_ENV

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          ISLPY_VERSION=${ISLPY_VERSION} python -m build --sdist
          mkdir -p dist-all
          cp dist/*.tar.gz dist-all/

      - name: List artifacts
        run: ls -l dist-all

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-all
          skip-existing: true
